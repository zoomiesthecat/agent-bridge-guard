version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
    ignore:
      # These releases change diagnostics/defaults and need a deliberate migration.
      - dependency-name: mypy
        versions: [">=2"]
      - dependency-name: ruff
        versions: [">=0.16"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
